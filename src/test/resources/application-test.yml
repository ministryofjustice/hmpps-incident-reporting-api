server:
  shutdown: immediate

management.endpoint:
  health.cache.time-to-live: 0
  info.cache.time-to-live: 0

api:
  base:
    url:
      oauth: http://localhost:8090/auth
      prisoner-search: http://localhost:8081
      manage:
        users: http://localhost:8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/incident_reporting?sslmode=prefer
    username: incident_reporting
    password: incident_reporting
    hikari:
      maximum-pool-size: 10
  main:
    allow-bean-definition-overriding: true

  jpa:
    show-sql: true

hmpps.sqs:
  provider: localstack
  queues:
    audit:
      queueName: ${random.uuid}
    incidentreporting:
      queueName: ${random.uuid}
      dlqName: ${random.uuid}
      subscribeTopicId: domainevents
      subscribeFilter: >-
        {"eventType": [
          "prison-offender-events.prisoner.merged",
          "prison-offender-events.prisoner.booking.moved"
        ]}
    test:
      queueName: ${random.uuid}
      dlqName: ${random.uuid}
      subscribeTopicId: domainevents
      subscribeFilter: >-
        {"eventType": [
          {"prefix": "incident.report."}
        ]}
  topics:
    domainevents:
      arn: arn:aws:sns:eu-west-2:000000000000:${random.uuid}

# The SAR test library's approval files. See SubjectAccessRequestLibraryTest for what each check guards.
hmpps.sar:
  tests:
    attachments-expected: false
    # Bump only after checking the new migration against the SAR response and the data requirements extract.
    expected-flyway-schema-version: "1.50"
    expected-api-response:
      path: /sar/expected-api-response.json
    expected-jpa-entity-schema:
      path: /sar/expected-jpa-entity-schema.json
    expected-render-result:
      path: /sar/expected-render-result.html
